{% extends 'main.html' %}
{% block content %}
<h2>Forgot Password</h2>
<p>Enter your registered email address</p>
<form method="POST">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Enter your email" required>
    <br><br>
    <button type="submit">Continue</button>
</form>
<a href="{% url 'login' %}">Back to Login</a>
{% endblock content %}
