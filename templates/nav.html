<nav>
    <a href="{% url 'admin_dashboard' %}" class="logo">📚 Library Management</a>
    <ul class="nav-links">
        {% if request.session.userid %}
            <li><a href="{% url 'book_list' %}">Books</a></li>
            <li><a href="{% url 'search_book' %}">Search Book</a></li>
            {% if request.session.role == "admin" %}
                <li><a href="{% url 'add_book' %}">Add Book</a></li>
            {% endif %}
            <li>Welcome, {{ request.session.username }}</li>
            <li><a href="{% url 'logout' %}">Logout</a></li>
        {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="{% url 'signup' %}">Signup</a></li>
        {% endif %}
    </ul>
</nav>
